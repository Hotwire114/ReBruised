# Black & Bruised - PC settings. BlackAndBruised-Launcher.cmd edits this file; you can also edit it by hand.
# Environment variables of the same options override it (see PROGRESS.md).

# 60 = smooth 60 fps (the game's own 60 Hz timing, as in the NTSC release); 50 = the original PAL speed
framerate = 60
# windowed | borderless | exclusive   (F11 or Alt+Enter switches while playing)
display = exclusive
# off | on   16:9 with a wider view in fights (F9 switches while playing; costs speed in some camera angles)
widescreen = on
# on | off   with widescreen on: menus fill 16:9 too
widescreen_menus = on
# native (448 lines) | 720p | 1080p | 1440p | 4k | auto (fits your monitor) | lowest
resolution = auto
# off | fxaa | ssaa2 | ssaa2+fxaa
antialiasing = fxaa
# off | 2 | 4 | 8 | 16
anisotropic = 4
# how the picture is scaled to the window: area | sharp | bilinear | nearest
scaling = area
# hd | soft | sharp   (hd: crisp health bars, stars and icons)
hud = hd
# on | off
sound = on
# end a movie after this many seconds (safety net; movies end by themselves); 0 = never
movie_timeout = 0
# runtime debug panel at start (F1 toggles it)
debug_panel = off
# print game frames per second to logs\play.log
show_fps = off
launcher_glyphs = xbox
